version: 0.2

phases:
  install:
    commands:
      - echo "=== INSTALL PHASE ==="

  pre_build:
    commands:
      - echo "=== PRE BUILD PHASE ==="
      - ls -la

  build:
    commands:
      - echo "=== BUILD PHASE ==="
      - echo "Syncing to S3..."
      - aws s3 sync . s3://cicd-test-website-sagar --delete --exclude ".git/*" --exclude "buildspec.yml" --exclude "app.js"
      - echo "Done!"

  post_build:
    commands:
      - echo "=== POST BUILD PHASE ==="
      - echo "Setting content type for HTML..."
      - aws s3 cp s3://cicd-test-website-sagar/index.html s3://cicd-test-website-sagar/index.html --metadata-directive REPLACE --content-type "text/html" --cache-control "no-cache"
      - echo "Deploy complete!"

artifacts:
  files:
    - '**/*'
